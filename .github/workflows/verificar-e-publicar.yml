name: Verificar e publicar

# Em todo pull request e em toda mudança na main: roda as verificações e,
# se passarem, publica no site de teste (teste.saltybaby.com.br).
# Só a mudança na main (pull request aceito) vai também para o site de
# verdade (app.saltybaby.com.br), depois de o teste ter dado certo.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verificar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VPS_HOST: 93.127.212.199

jobs:
  verificar:
    name: Verificar (lint, tipos, testes e build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Montar o pacote para a VPS
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          tar -czf app.tgz -C .next/standalone .

      - uses: actions/upload-artifact@v4
        with:
          name: pacote
          path: app.tgz
          retention-days: 3

  publicar-teste:
    name: Publicar no teste.saltybaby.com.br
    needs: verificar
    # Pull requests vindos de fora do repositório não têm acesso aos segredos.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publicar-teste
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publicar
        with:
          ssh-usuario: sbdeployteste
          nome-processo: saltybaby-teste
          porta: 4100
          endereco: https://teste.saltybaby.com.br
          db-nome: saltybabyteste
          db-usuario: ${{ secrets.DB_TESTE_USUARIO }}
          db-senha: ${{ secrets.DB_TESTE_SENHA }}
          # Só no site de teste: permite apagar a importação do Notion para testar de novo.
          importacao-pode-apagar: sim
          ssh-chave: ${{ secrets.SSH_PRIVATE_KEY }}
          codigo-primeiro-acesso: ${{ secrets.CODIGO_PRIMEIRO_ACESSO }}
          google-client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google-client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}

  publicar-app:
    name: Publicar no app.saltybaby.com.br
    needs: [verificar, publicar-teste]
    # Só o que entrou na main (ou um pedido manual a partir da main).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: producao
      url: https://app.saltybaby.com.br
    concurrency:
      group: publicar-app
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publicar
        with:
          ssh-usuario: sbdeployapp
          nome-processo: saltybaby-app
          porta: 3100
          endereco: https://app.saltybaby.com.br
          db-nome: saltybaby
          db-usuario: saltybabyuser
          db-senha: ${{ secrets.DB_APP_SENHA }}
          importacao-pode-apagar: nao
          ssh-chave: ${{ secrets.SSH_PRIVATE_KEY }}
          codigo-primeiro-acesso: ${{ secrets.CODIGO_PRIMEIRO_ACESSO }}
          google-client-id: ${{ secrets.GOOGLE_CLIENT_ID }}
          google-client-secret: ${{ secrets.GOOGLE_CLIENT_SECRET }}
